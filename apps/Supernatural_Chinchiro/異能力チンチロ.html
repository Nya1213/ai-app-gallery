<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>異能力チンチロ</title>
<style>
:root{--bg:#d3e2d8;--felt:#1f5c52;--felt2:#17463f;--tx:#f3ead6;--mu:#b9cbbd;--paper:#f3ead6;--ink:#1c1a17;--gold:#e0b04c;--red:#c2412d;--ok:#8be0a4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08201d;--felt:#14463e;--felt2:#0e332d}}
:root[data-theme="dark"]{--bg:#08201d;--felt:#14463e;--felt2:#0e332d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--tx);line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:12px}
h1{font:800 26px/1.2 "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;margin:4px 0 10px;color:var(--ink);letter-spacing:.08em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:var(--paper)}}
:root[data-theme="dark"] h1{color:var(--paper)}
.card{background:var(--felt);border:2px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:10px}
.purses{display:flex;justify-content:space-between;align-items:center;background:var(--felt2);border:2px solid var(--gold);border-radius:14px;padding:8px 14px;margin-bottom:10px}
.purses small{display:block;color:var(--mu);font-size:12px}.purses b{font:700 22px "Hiragino Mincho ProN",serif;color:var(--gold)}
.purses .r{text-align:center;color:var(--mu);font-size:13px}.purses div:last-child{text-align:right}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.hd span{color:var(--mu);font-size:13px}.hd b{font:700 16px "Hiragino Mincho ProN",serif}
.dice{display:flex;gap:12px;justify-content:center;margin:6px 0 10px}
.die{width:56px;height:56px;border-radius:12px;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.die i{border-radius:50%;margin:1px}.die i.on{background:#1c1a17}
.die.q{background:var(--felt2);border:2px dashed var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font:700 26px sans-serif}
.shake .die{animation:sh .12s infinite}
@keyframes sh{0%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-6px)}100%{transform:rotate(-8deg) translateY(0)}}
@media (prefers-reduced-motion:reduce){.shake .die{animation:none}}
.pot{text-align:center;margin:2px 0 10px;font:700 16px "Hiragino Mincho ProN",serif;color:var(--gold)}
.mini{display:flex;gap:8px}.mc{flex:1;background:var(--paper);color:var(--ink);border-radius:8px;padding:6px;text-align:center;font-size:12px;min-height:44px}
.mc.back{background:var(--felt2);color:var(--gold);border:1px dashed var(--gold);font-size:20px;display:flex;align-items:center;justify-content:center}
.mc.used{outline:3px solid var(--red)}.mc b{display:block;font-size:13px}
.ty{display:inline-block;font-size:11px;color:#fff;background:var(--red);border-radius:4px;padding:0 6px}
.abs{display:grid;gap:8px;margin-top:8px}
.ab{text-align:left;background:var(--paper);color:var(--ink);border:0;border-left:8px solid var(--red);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.ab b{font:700 16px "Hiragino Mincho ProN",serif;margin-left:6px}.ab small{display:block;margin-top:2px;font-size:12px;color:#4a463c}
.ab:disabled{opacity:.45;cursor:default}.ab.used{opacity:1;outline:3px solid var(--gold)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;margin:8px 0}
.main{flex:1;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:12px;font:700 16px inherit;font-family:inherit;cursor:pointer}
.main.alt{background:var(--red);color:#fff}.main:disabled{opacity:.4;cursor:default}
.ghost{flex:1;background:transparent;color:var(--tx);border:1px solid var(--gold);border-radius:8px;padding:8px;font:inherit;cursor:pointer}
.big{text-align:center;font:800 44px "Hiragino Mincho ProN",serif;color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
.res{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;text-align:center;margin:8px 0}
.res b{font:800 22px "Hiragino Mincho ProN",serif}.res.win b{color:#1f7a3d}.res.lose b{color:var(--red)}.res small{display:block;color:#4a463c}
.log{font-size:13px;color:var(--mu);margin:0;padding-left:18px}.log li:last-child{color:var(--tx)}
details{color:var(--mu);font-size:13px;margin-bottom:10px}summary{cursor:pointer}
</style>
</head>
<body>
<div id="app">
<h1>異能力チンチロ</h1>
<div class="purses" id="pur"></div>
<div id="main"></div>
<div class="card" id="logc"><ol class="log" id="log"></ol></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const rd=()=>1+Math.floor(Math.random()*6), r3=()=>[rd(),rd(),rd()];
function ev(d){const[a,b,c]=[...d].sort((x,y)=>x-y);
 if(a==b&&b==c)return a==1?{n:'ピンゾロ',r:100,m:5}:{n:a+'のゾロ目',r:90+a,m:3};
 if(a==4&&b==5&&c==6)return{n:'シゴロ',r:80,m:2};
 if(a==1&&b==2&&c==3)return{n:'ヒフミ',r:0,m:2};
 if(a==b)return{n:c+'の目',r:10+c,m:1};
 if(b==c)return{n:a+'の目',r:10+a,m:1};
 return{n:'目なし',r:5,m:1}}
const sc=d=>ev(d).r, imx=d=>d.indexOf(Math.max(...d)), imn=d=>d.indexOf(Math.min(...d));
const sm=d=>d.reduce((a,b)=>a+b,0);
const best=l=>l.reduce((a,b)=>sc(b)>sc(a)?b:a);
const adopt=(m,nd,ai)=>{if(ai&&sc(nd)<=sc(m.d))return'効果なし';m.d=nd;return'出目が '+nd.join('・')+' になった'};
const A=[
{n:'時間回帰',ty:'時間',ds:'振り直し+2回。役が出ていても振り直せる',ok:m=>sc(m.d)<=13,fn:(m,f,ai)=>{if(ai){m.d=best([m.d,r3(),r3(),r3()]);return'運命をやり直した'}m.max+=2;m.free=1;return'振り直し回数+2'}},
{n:'運命改竄',ty:'操作',ds:'自分の最小の目を5に変える',nd:1,fn:(m,f,ai)=>{const d=[...m.d];d[imn(d)]=5;return adopt(m,d,ai)}},
{n:'反転世界',ty:'反転',ds:'自分の全ダイスを 7−目 に反転する（悪化するなら反転しない）',nd:1,fn:(m,f)=>adopt(m,m.d.map(x=>7-x),1)},
{n:'賭博の悪魔',ty:'賭け',ds:'勝てば配当2倍、負ければ支払い、1.5倍',ok:m=>sc(m.d)>=15,fn:m=>{m.f.gamble=1;return'勝てば2倍・負ければ1.5倍'}},
{n:'鉄壁',ty:'防御',ds:'負けた時の支払いが半額になる',ok:m=>sc(m.d)<=13,fn:m=>{m.f.guard=1;return'敗北時の支払いが半額に'}},
{n:'衰弱の呪い',ty:'妨害',ds:'相手のダイス1つを−1する（役が弱くなる目をランダムに選ぶ）',fn:(m,f)=>{const c=[0,1,2].map(i=>{const d=[...f.d];d[i]=Math.max(1,d[i]-1);return d}).filter(d=>sc(d)<sc(f.d));if(c.length)f.d=c[Math.floor(Math.random()*c.length)];return'相手の出目が弱まった'}},
{n:'封印',ty:'封印',ds:'相手の異能力を封じ、効果を打ち消す',ok:(m,f)=>Object.keys(f.f).length>0,fn:(m,f,ai)=>{if(ai){f.f={};return'相手の異能効果を打ち消した'}f.sealed=1;return'相手の異能力を封じた'}},
{n:'透視',ty:'情報',ds:'相手の出目と異能力を見破り、もう1つ異能力を使える。負け時の支払いも半額',ok:()=>false,fn:(m,f,ai)=>{if(!ai){G.reveal=1;G.used=0;m.f.guard=1}return'相手の手の内が見えた。もう1つ使える（負け時の支払い半額）'}},
{n:'因果干渉',ty:'強制',ds:'相手のダイスを全て振り直させ、悪い方の結果を採用する',ok:(m,f)=>sc(f.d)>sc(m.d),fn:(m,f)=>{const a=r3(),b=r3();f.d=sc(a)<sc(b)?a:b;return'相手のダイスが振り直された'}},
{n:'位置交換',ty:'交換',ds:'自分の最小の目と相手の最大の目を入れ替える',nd:1,ok:(m,f)=>Math.max(...f.d)>Math.min(...m.d),fn:(m,f)=>{const a=[...m.d],b=[...f.d],i=imn(a),j=imx(b);[a[i],b[j]]=[b[j],a[i]];m.d=a;f.d=b;return'目が入れ替わった'}},
{n:'幸運の連鎖',ty:'確率',ds:'3回振り直し、最良の結果を採用する',nd:1,fn:(m,f,ai)=>adopt(m,best([r3(),r3(),r3()]),ai)},
{n:'分身の術',ty:'複製',ds:'同じ目が2つあれば、残りの1つを6に変える',nd:1,fn:m=>{const s=[...m.d].sort((x,y)=>x-y),p=s[0]==s[1]?s[0]:s[1]==s[2]?s[1]:0;if(!p)return'不発（ペアなし）';m.d=[p,p,6];return'ペア＋6の目になった'}},
{n:'再生',ty:'回復',ds:'即座に賭け金の60%を回復する',fn:m=>{const t=Math.round(G.bet*.6);m.m+=t;return'+'+t+'枚'}},
{n:'略奪',ty:'略奪',ds:'相手から賭け金の30%を即座に奪う',fn:(m,f)=>{const t=Math.min(Math.round(G.bet*.3),f.m);f.m-=t;m.m+=t;return t+'枚を奪った'}},
{n:'死に戻り',ty:'保険',ds:'最終役が目なし・ヒフミなら最大3回自動で振り直す',fn:m=>{m.f.ins=1;return'保険を掛けた'}},
{n:'弱体の領域',ty:'弱体',ds:'負けた時の配当倍率が1倍に固定され、さらに支払いが25%減る',ok:m=>sc(m.d)<=13,fn:m=>{m.f.weak=1;return'相手の役が弱体化した'}},
{n:'撤退',ty:'逃走',ds:'このラウンドを無効にし、賭け金を取り戻す',ok:(m)=>sc(m.d)<=11,fn:m=>{m.f.flee=1;return'勝負から離脱した'}},
{n:'概念逆転',ty:'概念',ds:'役の強弱が逆転する。シゴロ以上は逆転せず、逆転勝ちの配当は25%減る',ok:(m,f)=>sc(m.d)<sc(f.d)&&sc(f.d)<80,fn:m=>{m.f.rev=1;return'強弱が反転する'}},
{n:'優先権',ty:'優先',ds:'自分の役を1段階強く扱う。引き分けなら自分の勝ち',fn:m=>{m.f.pri=1;return'引き分けを制する'}},
{n:'第四の賽',ty:'数量',ds:'賭け金の30%を払い、ダイスを1個足して4個から最良の3個を採用する',nd:1,fn:(m,f,ai)=>{m.m-=Math.round(G.bet*.3);const x=[...m.d,rd()];return adopt(m,best([0,1,2,3].map(i=>x.filter((_,k)=>k!=i))),ai)}},
{n:'報復',ty:'反撃',ds:'負けた時、勝った相手から100枚奪い返す',ok:m=>sc(m.d)<=13,fn:m=>{m.f.retal=1;return'反撃の備えをした'}},
{n:'道連れ',ty:'自爆',ds:'負けた時、勝った相手も同額を失う（相手の得は0になる）',ok:m=>sc(m.d)<=12,fn:m=>{m.f.drag=1;return'道連れの覚悟を決めた'}},
{n:'鏡像',ty:'模倣',ds:'相手の出目をそのままコピーする',ok:(m,f)=>sc(f.d)>sc(m.d),fn:(m,f)=>{m.d=[...f.d];return'相手の出目を写し取った'}},
{n:'増幅',ty:'増幅',ds:'勝った時の配当倍率が+1.5される',ok:m=>sc(m.d)>=14,fn:m=>{m.f.amp=1;return'勝利の配当が増幅する'}},
{n:'ジャミング',ty:'干渉',ds:'相手の異能力が75%の確率で不発になる',ok:()=>false,fn:m=>{m.f.jam=1;return'相手の異能力に妨害をかけた'}},
{n:'ルール改竄',ty:'メタ',ds:'今回の勝敗を役ではなく「出目の合計」で決める。ゲームそのもののルールを書き換える',ok:(m,f)=>sm(m.d)>sm(f.d)&&sc(m.d)<=sc(f.d),fn:m=>{G.rule=1;return'勝敗のルールが「出目の合計勝負」に書き換わった'}}
];
const pick=()=>{const a=A.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,3).map(i=>A[i])};
const P={m:1000},E={m:1000};
const G={rule:0,round:0,ph:'bet',bet:100,log:[],reveal:0,anim:0,res:null,used:0};
const log=s=>G.log.push(s);
const caps=()=>{const c=Math.min(P.m,E.m);return[Math.min(10,c),c]};
const canRoll=()=>G.ph==='play'&&!G.anim&&P.t<P.max&&(!P.d||sc(P.d)===5||P.free);
const canShow=()=>G.ph==='play'&&!G.anim&&P.d&&(sc(P.d)!==5||P.t>=P.max);
function start(){const[lo,c]=caps();G.bet=Math.max(lo,Math.min(G.bet,c));G.round++;G.reveal=0;G.used=0;G.res=null;G.rule=0;
 [P,E].forEach(s=>Object.assign(s,{d:null,t:0,max:3,free:0,f:{},sealed:0,used:-1}));
 P.ab=pick();E.ab=pick();P.us=[];
 do{E.d=r3();E.t++}while(sc(E.d)===5&&E.t<E.max);
 G.ph='play';G.log=['ラウンド'+G.round+'開始。賭け金 '+G.bet+'枚。相手はすでに振り終えている'];render()}
function roll(){if(!canRoll())return;G.anim=1;render();
 setTimeout(()=>{G.anim=0;P.d=r3();P.t++;log('あなたの出目 '+P.d.join('・')+' → '+ev(P.d).n);render()},500)}
function use(i){const a=P.ab[i];if(G.ph!=='play'||G.used||G.anim||P.us.includes(i)||(a.nd&&!P.d))return;
 G.used=1;P.used=i;P.us.push(i);log('あなたの異能「'+a.n+'」！ '+a.fn(P,E,false));
 if(a.n==='撤退')return end({v:1,t:'あなたは勝負から離脱した'});render()}
function end(r){G.res=r;G.ph=(P.m<=0||E.m<=0)?'over':'result';render()}
function show(){if(!canShow())return;G.ph='result';
 const c=E.ab.filter(a=>!a.ok||a.ok(E,P));
 if(E.sealed)log('相手の異能力は封印された！');
 else if(P.f.jam&&Math.random()<.75)log('相手の異能力はジャミングで不発に終わった');
 else if(c.length&&Math.random()<.95){const a=c[Math.floor(Math.random()*c.length)];E.used=E.ab.indexOf(a);log('相手の異能「'+a.n+'」！ '+a.fn(E,P,true))}
 else log('相手は異能力を使わなかった');
 [P,E].forEach(s=>{if(s.f.ins&&sc(s.d)<=5){let t=0;while(sc(s.d)<=5&&t++<3)s.d=r3();log((s===P?'あなた':'相手')+'の保険が発動 → '+s.d.join('・'))}});
 if(E.f.flee)return end({v:1,t:'相手が勝負から離脱した'});
 const pr=ev(P.d),er=ev(E.d),rev=!!P.f.rev!==!!E.f.rev;
 let c2=G.rule?Math.sign(sm(P.d)-sm(E.d)):Math.sign(pr.r+(P.f.pri?1.5:0)-er.r-(E.f.pri?1.5:0));if(rev&&(G.rule||(pr.r<80&&er.r<80)))c2=-c2;
 if(!c2){if(P.f.pri&&!E.f.pri)c2=1;else if(E.f.pri&&!P.f.pri)c2=-1}
 if(!c2)return end({d:1,pr,er,rule:G.rule,ps:sm(P.d),es:sm(E.d)});
 const W=c2>0?P:E,L=c2>0?E:P,wr=c2>0?pr:er,lr=c2>0?er:pr;
 let mul=Math.max(wr.m,lr.r===0?2:1);if(W.f.amp)mul+=1.5;if(L.f.weak)mul=1;if(W.f.cap2)mul=Math.min(mul,2);
 let amt=Math.round(G.bet*mul*(W.f.gamble?2:1)*(L.f.gamble?1.5:1));
 if(L.f.guard)amt=Math.floor(amt/2);if(L.f.weak)amt=Math.floor(amt*.75);if(rev&&W.f.rev)amt=Math.floor(amt*.75);
 amt=Math.min(amt,L.m);L.m-=amt;W.m+=amt;if(L.f.retal){const t=Math.min(100,W.m);W.m-=t;L.m+=t;log((L===P?'あなた':'相手')+'の報復！ '+t+'枚を奪い返した')}if(L.f.drag){const t=Math.min(amt,W.m);W.m-=t;log((L===P?'あなた':'相手')+'の道連れ！ 勝者も'+t+'枚を失った')}
 end({w:W===P?'p':'e',amt,mul,pr,er,rev,rule:G.rule,ps:sm(P.d),es:sm(E.d)})}
const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const die=v=>v?'<div class="die">'+[...Array(9)].map((_,i)=>'<i class="'+(PIP[v].includes(i)?'on':'')+'"></i>').join('')+'</div>':'<div class="die q">?</div>';
const dice=(d,hide,an)=>'<div class="dice'+(an?' shake':'')+'">'+(d?d:[0,0,0]).map(v=>die(hide?0:an?rd():v)).join('')+'</div>';
const RN=r=>'あなた '+r.pr.n+(r.rule?'（合計'+r.ps+'）':'')+' / 相手 '+r.er.n+(r.rule?'（合計'+r.es+'）':'');
const RULES='<details><summary>ルールを見る</summary><p>3つのサイコロを最大3回まで振って役で勝負。強さは ピンゾロ(5倍) ＞ ゾロ目(3倍) ＞ シゴロ456(2倍) ＞ 出目(ペア以外の1つの目・1倍) ＞ 目なし ＞ ヒフミ123(負けると2倍払い)。毎ラウンド、26種の異能力からランダムに3つが配られ、使えるのは1つだけ。相手も別の3つを持ち、1つ使ってくる。相手の出目は伏せられているので、情報を集めて異能力を選ぼう。どちらかの所持金がなくなると終了。</p></details>';
function render(){
 const rv=G.ph==='result'||G.ph==='over'||G.reveal;
 $('#pur').innerHTML='<div><small>あなた</small><b>'+P.m+'</b></div><div class="r">'+(G.round?'ラウンド '+G.round:'開始前')+'</div><div><small>相手</small><b>'+E.m+'</b></div>';
 $('#logc').style.display=G.log.length?'':'none';
 $('#log').innerHTML=G.log.slice(-7).map(s=>'<li>'+s+'</li>').join('');
 const M=$('#main');
 if(G.ph==='bet'){const[lo,c]=caps();G.bet=Math.max(lo,Math.min(G.bet,c));
  M.innerHTML='<div class="card"><div class="hd"><b>賭け金を決める</b><span>最大 '+c+'枚</span></div><div class="big" id="bv">'+G.bet+'</div><input type="range" id="bs" min="'+lo+'" max="'+c+'" value="'+G.bet+'" aria-label="賭け金"><div class="row">'+[['10%',.1],['25%',.25],['50%',.5],['全額',1]].map(x=>'<button class="ghost" data-q="'+x[1]+'">'+x[0]+'</button>').join('')+'</div><button class="main" style="width:100%" data-a="start">この額で勝負</button></div>'+RULES;return}
 const res=G.res;let rh='';
 if(res){if(res.v)rh='<div class="res"><b>ノーゲーム</b><small>'+res.t+'。賭け金は動かない</small></div>';
  else if(res.d)rh='<div class="res"><b>引き分け</b><small>'+RN(res)+'</small></div>';
  else{const w=res.w==='p';rh='<div class="res '+(w?'win':'lose')+'"><b>'+(w?'勝利 +':'敗北 −')+res.amt+'枚</b><small>'+RN(res)+'（配当 '+res.mul+'倍'+(res.rev?'・強弱逆転':'')+'）</small></div>'}}
 if(G.ph==='over')rh+='<div class="res"><b>'+(E.m<=0?'相手を破産させた！':'所持金が尽きた…')+'</b></div>';
 const eAb=E.ab.map((a,i)=>rv?'<div class="mc'+(E.used===i?' used':'')+'"><b>'+a.n+'</b><span class="ty">'+a.ty+'</span></div>':'<div class="mc back">？</div>').join('');
 const pAb=P.ab.map((a,i)=>{const dis=G.ph!=='play'||G.used||G.anim||P.us.includes(i)||(a.nd&&!P.d);return'<button class="ab'+(P.us.includes(i)?' used':'')+'" data-i="'+i+'"'+(dis?' disabled':'')+'><span class="ty">'+a.ty+'</span><b>'+a.n+'</b><small>'+a.ds+(a.nd&&!P.d?'（出目が出てから使える）':'')+'</small></button>'}).join('');
 let btn='';
 if(G.ph==='play')btn='<div class="row"><button class="main" data-a="roll"'+(canRoll()?'':' disabled')+'>サイコロを振る</button><button class="main alt" data-a="show"'+(canShow()?'':' disabled')+'>勝負する</button></div>';
 else btn='<div class="row"><button class="main" data-a="'+(G.ph==='over'?'reset':'next')+'">'+(G.ph==='over'?'最初からやり直す':'次のラウンドへ')+'</button></div>';
 M.innerHTML='<div class="card"><div class="hd"><b>対戦相手</b><span>'+(rv?'出目：'+ev(E.d).n:'出目は伏せられている')+'</span></div>'+dice(E.d,!rv)+'<div class="mini">'+eAb+'</div></div>'
 +'<div class="pot">賭け金 '+G.bet+'枚'+(G.rule?'　※出目の合計で勝負':'')+'</div>'+rh
 +'<div class="card"><div class="hd"><b>あなた</b><span>'+(P.d?ev(P.d).n+'　':'')+'振り '+P.t+'/'+P.max+'</span></div>'+dice(P.d,false,G.anim)+btn
 +'<div class="hd" style="margin-top:6px"><b>異能力</b><span>1ラウンドに1回だけ使える</span></div><div class="abs">'+pAb+'</div></div>'}
$('#main').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.a==='start')start();else if(d.a==='roll')roll();else if(d.a==='show')show();
 else if(d.a==='next'){G.ph='bet';render()}
 else if(d.a==='reset'){P.m=E.m=1000;G.round=0;G.log=[];G.ph='bet';render()}
 else if(d.q){const[lo]=caps();G.bet=Math.max(lo,Math.round(caps()[1]*+d.q));render()}
 else if(d.i!==undefined)use(+d.i)});
$('#main').addEventListener('input',e=>{if(e.target.id==='bs'){G.bet=+e.target.value;$('#bv').textContent=G.bet}});
render();
})();
</script>
</body>
</html>
